query ResolveUserProjectIssueContext(
  $owner: String!
  $repo: String!
  $number: Int!
  $projectOwner: String!
  $projectNumber: Int!
) {
  repository(owner: $owner, name: $repo) {
    issue(number: $number) {
      id
    }
  }
  user(login: $projectOwner) {
    projectV2(number: $projectNumber) {
      id
    }
  }
}
