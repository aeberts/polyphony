query ResolveProjectOwnerIssueContext(
  $owner: String!
  $repo: String!
  $number: Int!
  $projectOwner: String!
  $projectNumber: Int!
) {
  repository(owner: $owner, name: $repo) {
    issue(number: $number) {
      id
    }
  }
  repositoryOwner(login: $projectOwner) {
    __typename
    ... on User {
      projectV2(number: $projectNumber) {
        id
      }
    }
    ... on Organization {
      projectV2(number: $projectNumber) {
        id
      }
    }
  }
}
